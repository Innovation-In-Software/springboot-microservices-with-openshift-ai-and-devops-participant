services:
  postgres:
    image: postgres:16-alpine
    container_name: md287-account-db
    environment:
      POSTGRES_DB: account_db
      POSTGRES_USER: account
      POSTGRES_PASSWORD: account
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U account -d account_db"]
      interval: 5s
      timeout: 5s
      retries: 10

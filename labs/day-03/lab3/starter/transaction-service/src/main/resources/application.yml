spring:
  application:
    name: transaction-service
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: transaction-service
      auto-offset-reset: earliest
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.md287.transaction.messaging
        spring.json.value.default.type: com.md287.transaction.messaging.TransactionSubmittedEvent
        spring.json.use.type.headers: false

server:
  port: 8082

md287:
  account-service:
    base-url: http://localhost:8081
  kafka:
    submitted-topic: transactions.submitted
  jwt:
    issuer: md287-lab
    secret: "md287-lab-only-hmac-secret-32bytes!"

resilience4j:
  circuitbreaker:
    instances:
      accountService:
        slidingWindowSize: 6
        minimumNumberOfCalls: 4
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 2
        automaticTransitionFromOpenToHalfOpenEnabled: true
        ignoreExceptions:
          - com.md287.transaction.api.exception.AccountNotEligibleException

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: MD287 Transaction Service — capstone service 2 of 3
    version: 1.0.0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.md287.transaction: INFO
    org.hibernate.SQL: WARN
    org.springframework.kafka: INFO

# Full-stack classroom run. Build context is the Lab 3 solution source.
# From this folder: docker compose up -d --build
#
# Stop Lab 1–3 Compose stacks first — they also bind 5433, 5434, 8081, 8082, and 9092.

name: md287-lab4

services:
  account-db:
    image: postgres:16-alpine
    container_name: md287-lab4-account-db
    environment:
      POSTGRES_DB: account_db
      POSTGRES_USER: account
      POSTGRES_PASSWORD: account
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U account -d account_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  transaction-db:
    image: postgres:16-alpine
    container_name: md287-lab4-transaction-db
    environment:
      POSTGRES_DB: transaction_db
      POSTGRES_USER: transaction
      POSTGRES_PASSWORD: transaction
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transaction -d transaction_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.8.1
    container_name: md287-lab4-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:19092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: md287lab4kraft0001
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-init:
    image: apache/kafka:3.8.1
    container_name: md287-lab4-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: >
      "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists
      --topic transactions.submitted --partitions 1 --replication-factor 1
      && /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists
      --topic transactions.submitted.DLT --partitions 1 --replication-factor 1
      && echo TOPICS_READY"
    restart: "no"

  account-service:
    image: md287/account-service:${ACCOUNT_TAG:-1.0.0}
    build:
      context: ../../../day-03/lab3/solution/account-service
      dockerfile: ../../../../day-04/lab4/starter/account-service/Containerfile
    container_name: md287-lab4-account
    depends_on:
      account-db:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: "8081"
      SPRING_DATASOURCE_URL: jdbc:postgresql://account-db:5432/account_db
      SPRING_DATASOURCE_USERNAME: account
      SPRING_DATASOURCE_PASSWORD: account
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics
      INFO_APP_VERSION: ${ACCOUNT_TAG:-1.0.0}

  transaction-service:
    image: md287/transaction-service:${TRANSACTION_TAG:-1.0.0}
    build:
      context: ../../../day-03/lab3/solution/transaction-service
      dockerfile: ../../../../day-04/lab4/starter/transaction-service/Containerfile
    container_name: md287-lab4-transaction
    depends_on:
      transaction-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      account-service:
        condition: service_started
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: "8082"
      SPRING_DATASOURCE_URL: jdbc:postgresql://transaction-db:5432/transaction_db
      SPRING_DATASOURCE_USERNAME: transaction
      SPRING_DATASOURCE_PASSWORD: transaction
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      MD287_ACCOUNT_SERVICE_BASE_URL: http://account-service:8081
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics
      INFO_APP_VERSION: ${TRANSACTION_TAG:-1.0.0}

# Apply into the assigned participant project (do not create a namespace):
#   oc apply -n <project> -f 01-configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: account-config
data:
  SERVER_PORT: "8081"
  SPRING_DATASOURCE_URL: jdbc:postgresql://account-db:5432/account_db
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: transaction-config
data:
  SERVER_PORT: "8082"
  SPRING_DATASOURCE_URL: jdbc:postgresql://transaction-db:5432/transaction_db
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
  MD287_ACCOUNT_SERVICE_BASE_URL: http://account-service:8081

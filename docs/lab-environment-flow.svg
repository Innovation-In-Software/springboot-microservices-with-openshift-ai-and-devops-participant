<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 780" width="1100" height="780" role="img" aria-labelledby="title desc">
  <title id="title">MD287 delivery flow aligned to the course outline</title>
  <desc id="desc">Participants use a TEKsystems VM every day. IIS ARO is required on Days 4 and 5 for OpenShift deploy and the pre-deployed model endpoint.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
  </defs>
  <rect width="1100" height="780" fill="#ffffff"/>
  <text x="550" y="34" text-anchor="middle" font-family="Calibri, Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#c00000">MD287 — outline delivery flow</text>
  <text x="550" y="56" text-anchor="middle" font-family="Calibri, Segoe UI, sans-serif" font-size="13" fill="#333333">Participants · Labs 1–5 · VM every day · ARO required on Days 4–5</text>

  <rect x="40" y="78" width="500" height="72" rx="8" fill="#1f4e79"/>
  <text x="290" y="106" text-anchor="middle" font-family="Calibri, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#ffffff">TEKsystems — participant VM</text>
  <text x="290" y="128" text-anchor="middle" font-family="Calibri, Segoe UI, sans-serif" font-size="12" fill="#d6e3f0">JDK 21 · Maven · Docker · Git · Python · oc · provided, keep as-is</text>

  <rect x="560" y="78" width="500" height="72" rx="8" fill="#c00000"/>
  <text x="810" y="106" text-anchor="middle" font-family="Calibri, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#ffffff">IIS — ARO OpenShift</text>
  <text x="810" y="128" text-anchor="middle" font-family="Calibri, Segoe UI, sans-serif" font-size="12" fill="#f8d7da">Required Days 4–5 · one project per participant</text>

  <rect x="250" y="172" width="600" height="48" rx="8" fill="#1f4e79"/>
  <text x="550" y="192" text-anchor="middle" font-family="Calibri, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Participant logs on · git clone public repo (no GitHub login)</text>
  <text x="550" y="210" text-anchor="middle" font-family="Calibri, Segoe UI, sans-serif" font-size="12" fill="#d6e3f0">Work in each lab starter/ folder</text>

  <line x1="290" y1="150" x2="420" y2="172" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="244" width="1020" height="88" rx="8" fill="#f2f2f2" stroke="#1f4e79" stroke-width="2"/>
  <text x="56" y="268" font-family="Calibri, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#c00000">Days 1–3 — VM only (ARO idle)</text>
  <rect x="56" y="280" width="310" height="40" rx="6" fill="#1f4e79"/>
  <text x="211" y="305" text-anchor="middle" font-family="Calibri, Segoe UI, sans-serif" font-size="12" fill="#ffffff">Lab 1 Account · :8081 :5433</text>
  <rect x="396" y="280" width="310" height="40" rx="6" fill="#1f4e79"/>
  <text x="551" y="305" text-anchor="middle" font-family="Calibri, Segoe UI, sans-serif" font-size="12" fill="#ffffff">Lab 2 Transaction · Kafka :9092</text>
  <rect x="736" y="280" width="308" height="40" rx="6" fill="#1f4e79"/>
  <text x="890" y="305" text-anchor="middle" font-family="Calibri, Segoe UI, sans-serif" font-size="12" fill="#ffffff">Lab 3 JWT · issue-jwt.py</text>
  <line x1="550" y1="220" x2="550" y2="244" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="366" y1="300" x2="396" y2="300" stroke="#1f4e79" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="706" y1="300" x2="736" y2="300" stroke="#1f4e79" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="356" width="1020" height="168" rx="8" fill="#fff8f0" stroke="#c00000" stroke-width="2"/>
  <text x="56" y="380" font-family="Calibri, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#c00000">Day 4 — Lab 4  Deploy to pre-provisioned OpenShift (outline)</text>
  <rect x="56" y="396" width="480" height="56" rx="6" fill="#1f4e79"/>
  <text x="296" y="420" text-anchor="middle" font-family="Calibri, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#ffffff">On the VM</text>
  <text x="296" y="438" text-anchor="middle" font-family="Calibri, Segoe UI, sans-serif" font-size="12" fill="#d6e3f0">docker build · Compose probes · run-pipeline-locally.ps1</text>
  <rect x="560" y="396" width="480" height="56" rx="6" fill="#c00000"/>
  <text x="800" y="420" text-anchor="middle" font-family="Calibri, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#ffffff">On ARO — required</text>
  <text x="800" y="438" text-anchor="middle" font-family="Calibri, Segoe UI, sans-serif" font-size="12" fill="#f8d7da">oc login · apply YAML · push-images.ps1 · Route 200 · rollout undo</text>
  <rect x="56" y="468" width="984" height="40" rx="6" fill="#548235"/>
  <text x="548" y="493" text-anchor="middle" font-family="Calibri, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Lab 4 complete only when the Account Route is Ready and rollback history exists</text>
  <line x1="810" y1="150" x2="810" y2="396" stroke="#c00000" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="550" y1="332" x2="550" y2="356" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="548" width="1020" height="168" rx="8" fill="#f3f8ff" stroke="#1f4e79" stroke-width="2"/>
  <text x="56" y="572" font-family="Calibri, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#c00000">Day 5 — Lab 5  Pre-deployed OpenShift AI endpoint + Risk deploy (outline)</text>
  <rect x="56" y="588" width="480" height="56" rx="6" fill="#1f4e79"/>
  <text x="296" y="612" text-anchor="middle" font-family="Calibri, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#ffffff">On the VM</text>
  <text x="296" y="630" text-anchor="middle" font-family="Calibri, Segoe UI, sans-serif" font-size="12" fill="#d6e3f0">PolicyEngine · local mock :8090 · sample TransactionSubmitted events</text>
  <rect x="560" y="588" width="480" height="56" rx="6" fill="#c00000"/>
  <text x="800" y="612" text-anchor="middle" font-family="Calibri, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#ffffff">On ARO — required</text>
  <text x="800" y="630" text-anchor="middle" font-family="Calibri, Segoe UI, sans-serif" font-size="12" fill="#f8d7da">MD287_MODEL_ROUTE health · deploy Risk · Route evidence</text>
  <rect x="56" y="660" width="984" height="40" rx="6" fill="#548235"/>
  <text x="548" y="685" text-anchor="middle" font-family="Calibri, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Capstone: success · duplicate · model timeout HOLD · human review · OpenShift evidence · rollback</text>

  <line x1="548" y1="524" x2="548" y2="548" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="810" y1="524" x2="810" y2="588" stroke="#c00000" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="550" y="748" text-anchor="middle" font-family="Calibri, Segoe UI, sans-serif" font-size="12" fill="#666666">Not in this flow: Keycloak · Redis · Jenkins · MCP runtime · GitHub account · custom domain</text>
  <text x="550" y="768" text-anchor="middle" font-family="Calibri, Segoe UI, sans-serif" font-size="11" fill="#999999">© 2026 Innovation In Software Corporation · MD287</text>
</svg>
